[project]
name = "grounded-docparse"
version = "0.3.0"
description = "Grounded agentic document parser for structured Markdown and JSON"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=2.0",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pymupdf>=1.25",
    "streamlit[pdf]>=1.60,<2",
]

[project.optional-dependencies]
local-ocr = [
    "glmocr[selfhosted]==0.1.5; sys_platform == 'linux'",
    "transformers>=5.3,<6; sys_platform == 'linux'",
    "vllm==0.19.1; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
