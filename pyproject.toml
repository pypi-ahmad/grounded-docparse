[project]
name = "grounded-docparse"
version = "0.2.0"
description = "Grounded agentic document parser for structured Markdown and JSON"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=2.0",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pymupdf>=1.25",
    "streamlit[pdf]>=1.60,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
