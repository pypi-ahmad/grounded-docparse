[project]
name = "grounded-docparse"
version = "0.7.0"
description = "Grounded agentic document parser for structured Markdown and JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "nh3>=0.3.6,<0.4",
    "openai>=2.0",
    "google-genai>=2.13,<3",
    "openpyxl>=3.1.5,<4",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pymupdf>=1.25",
    "python-dotenv>=1.1,<2",
    "streamlit[pdf]>=1.60,<2",
]

[project.urls]
Repository = "https://github.com/pypi-ahmad/grounded-docparse"
Issues = "https://github.com/pypi-ahmad/grounded-docparse/issues"
Changelog = "https://github.com/pypi-ahmad/grounded-docparse/blob/main/CHANGELOG.md"

[project.scripts]
grounded-docparse = "grounded_docparse.cli:main"

[project.optional-dependencies]
native = [
    "beautifulsoup4>=4.13,<5",
    "docling[rapidocr]>=2.119,<3",
    "langextract[openai]>=1.6,<2",
    "odfdo>=3.12,<4",
    "pdf-inspector>=1.14.1,<2",
    "pywin32>=311; sys_platform == 'win32'",
]
local-ocr = [
    "glmocr[selfhosted]==0.1.5; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchvision==0.25.0; sys_platform == 'linux'",
    "transformers>=5.3,<6; sys_platform == 'linux'",
    "vllm==0.19.1; sys_platform == 'linux'",
]
local-ocr-cpu = [
    "glmocr[selfhosted]==0.1.5; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchvision==0.25.0; sys_platform == 'linux'",
    "transformers>=5.3,<6; sys_platform == 'linux'",
]
windows-layout = [
    "torch==2.10.0; sys_platform == 'win32'",
    "torchvision==0.25.0; sys_platform == 'win32'",
    "transformers>=5.3,<6; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
conflicts = [[{ extra = "local-ocr" }, { extra = "local-ocr-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "local-ocr" },
    { index = "pytorch-cpu", extra = "local-ocr-cpu" },
    { index = "pytorch-cpu", extra = "windows-layout" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "local-ocr" },
    { index = "pytorch-cpu", extra = "local-ocr-cpu" },
    { index = "pytorch-cpu", extra = "windows-layout" },
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
