name: grounded-docparse

x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    DOCPARSE_API_TOKEN: ${DOCPARSE_API_TOKEN}
    DOCPARSE_DATABASE_URL: postgresql+psycopg://docparse:${POSTGRES_PASSWORD}@postgres:5432/docparse
    DOCPARSE_REDIS_URL: redis://redis:6379/0
    DOCPARSE_ARTIFACT_BACKEND: s3
    DOCPARSE_S3_ENDPOINT: http://minio:9000
    DOCPARSE_S3_BUCKET: documents
    DOCPARSE_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    DOCPARSE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}

services:
  config-check:
    image: python:3.13.7-slim
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DOCPARSE_API_TOKEN: ${DOCPARSE_API_TOKEN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./src/grounded_docparse/compose_env.py:/compose_env.py:ro
    command: ["python", "/compose_env.py", "check"]
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    depends_on:
      config-check: {condition: service_completed_successfully}
    environment:
      POSTGRES_DB: docparse
      POSTGRES_USER: docparse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docparse"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    depends_on:
      config-check: {condition: service_completed_successfully}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    depends_on:
      config-check: {condition: service_completed_successfully}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/documents
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  api:
    <<: *app
    ports: ["${DOCPARSE_API_PORT:-8000}:8000"]
  worker:
    <<: *app
    command: ["celery", "-A", "grounded_docparse.worker:celery_app", "worker", "--loglevel=INFO", "--queues=realtime"]
  batch-worker:
    <<: *app
    command: ["celery", "-A", "grounded_docparse.worker:celery_app", "worker", "--loglevel=INFO", "--queues=batch", "--concurrency=1"]
  ui:
    <<: *app
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      <<: *app-env
      DOCPARSE_API_URL: http://api:8000
    ports: ["8501:8501"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
