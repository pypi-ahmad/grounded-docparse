name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: uv sync --locked --extra native

      - name: Lint
        run: uvx ruff check src streamlit_app.py tests scripts

      - name: Compile check
        run: uv run python -m compileall -q src streamlit_app.py tests scripts

      - name: Test
        run: uv run python -m pytest -q
